<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Workshop Hub home hero placeholder">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8e6fb"/>
      <stop offset="50%" stop-color="#fce4f4"/>
      <stop offset="100%" stop-color="#ffc2dd"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="380" fill="url(#g)"/>
  <rect width="1200" height="380" fill="url(#shine)"/>
  <!-- Decorative circles -->
  <circle cx="80" cy="60" r="120" fill="#7dd4f8" opacity="0.3"/>
  <circle cx="1150" cy="320" r="160" fill="#f9659b" opacity="0.2"/>
  <circle cx="600" cy="400" r="200" fill="#38bef8" opacity="0.12"/>
  <circle cx="950" cy="40" r="90" fill="#ffc2dd" opacity="0.35"/>
  <!-- Stars / sparkles -->
  <text x="200" y="120" font-size="28" opacity="0.5">✦</text>
  <text x="900" y="200" font-size="22" opacity="0.4">✦</text>
  <text x="500" y="60" font-size="18" opacity="0.45">✦</text>
  <text x="1050" y="150" font-size="30" opacity="0.35">✦</text>
  <!-- Placeholder label -->
  <rect x="380" y="130" width="440" height="100" rx="16" fill="rgba(255,255,255,0.5)"/>
  <text x="600" y="185" text-anchor="middle" font-family="Nunito, sans-serif" font-size="22" font-weight="800" fill="#0284c7">🏠 Hero Image – Home Page</text>
  <text x="600" y="215" text-anchor="middle" font-family="Nunito, sans-serif" font-size="14" fill="#0ea5e9">Replace with your custom image</text>
</svg>
