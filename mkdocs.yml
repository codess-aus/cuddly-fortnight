site_name: Workshop Hub
site_url: https://codess-aus.github.io/cuddly-fortnight/
site_description: >-
  Workshops for Leaders managing AI product development and Students beginning
  their journey with AI, GitHub, and product thinking.
site_author: Workshop Hub Team
repo_url: https://github.com/codess-aus/cuddly-fortnight
repo_name: codess-aus/cuddly-fortnight
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    # Light mode (default)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Nunito
    code: Fira Code
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.tooltips
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/codess-aus/cuddly-fortnight
      name: Workshop Hub on GitHub
  generator: false

extra_css:
  - assets/css/custom.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: en

nav:
  - Home: index.md
  - Leaders Track:
    - leaders/index.md
    - Understanding AI: leaders/understanding-ai.md
    - Managing AI Teams: leaders/managing-ai-teams.md
    - AI Product Strategy: leaders/ai-product-strategy.md
    - Ethics & Responsibility: leaders/ethics-and-responsibility.md
  - Students Track:
    - students/index.md
    - Intro to AI: students/intro-to-ai.md
    - GitHub Basics: students/github-basics.md
    - Product Development: students/product-development.md
    - Build with AI: students/build-with-ai.md
  - Resources: resources.md
  - About: about.md
